# Kritzel settings.  Lines starting with # show the defaults.
# Changes apply after:  kritzel restart

[panel]
# Height of the panel in (scaled) pixels, and its maximum width (0 = full screen width).
#height = 280
#max_width = 0
# Width of the panel while it floats.
#float_width = 760
# Thickness of the ink on screen.
#pen_width = 2.6

[recognition]
# Pause after the last pen stroke before the writing is recognised (milliseconds).
# Raise it if words get split because you write slowly.
#delay_ms = 800

# true:  recognised text is typed immediately; tap another suggestion to swap it.
# false: nothing is typed until you tap one of the suggestions.
#auto_insert = true

# Insert a space between consecutive chunks of writing where it makes sense.
#auto_space = true

# How tapping another suggestion replaces the word that was typed:
#   auto  delete and insert in one step where the application supports it,
#         otherwise Backspace keys followed by the new word
#   keys  always Backspace keys (try this if replacing misbehaves in some application)
#replace = auto

# Characters the recogniser may output:
#   western  ASCII + Latin-1: English, German, French, Spanish, Italian, Nordic ...
#   latin    additionally Latin Extended: Polish, Czech, Turkish, Hungarian ...
#   all      everything the model knows (adds Chinese and Japanese)
#scripts = western

# Spell-check dictionaries (hunspell, /usr/share/hunspell) used to choose between
# look-alike readings such as "Guten"/"Duten".  auto = session language + English.
# Examples:  languages = de_DE, en_US      languages = none
#languages = auto
# How strongly a dictionary word is preferred (0 = dictionaries off).
#dictionary_weight = 1.5

# small (bundled, ~20 MB) or medium (more accurate; see README), or a path to an .onnx file.
#model = small
#threads = 2
