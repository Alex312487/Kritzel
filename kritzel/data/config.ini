# Kritzel settings.  Lines starting with # show the defaults.
# The settings window (`kritzel settings`, or the settings key on the panel)
# edits this file for you and rewrites it without these comments.
# After editing by hand:  kritzel reload

[panel]
# Height of the panel in (scaled) pixels.
#height = 280
# Width of the docked panel (0 = full width of the screen) and of the floating one.
#max_width = 0
#float_width = 760
# When the panel appears:
#   touch   only when a text field is tapped with a finger or the pen
#   always  whenever a text field gets the focus, also by mouse or keyboard
#show = touch
# true: after a restart the panel floats again where it was left.
#remember_floating = false

[keys]
# The keys on the panel besides Backspace and Settings, which are always there:
#   enter space word arrows copy paste cut home_end delete tab
#   language symbols keyboard float hide
# List the ones you want; the panel arranges them by itself.
#keys = enter space word arrows copy paste language symbols keyboard float hide
# Side of the panel the keys are on: right | left
#keys_side = right
# small | normal | large
#key_size = normal
# Backspace, Delete and the arrow keys repeat while held.
#key_repeat = true
# The symbol keyboard that the "symbols" key puts in the place of the writing
# area.  Keys are separated by spaces; a key may type several characters.
#symbol_keys = 1 2 3 4 5 6 7 8 9 0 = . , ? ! ' " - : ; ( ) @ # € $ % & + * / \ _ < > [ ] { } | ~ ^ ° §
# false: go back to the writing area after one symbol.
#symbols_stay = true
# A thin row of symbol keys above the writing area, and its keys (as many as fit are shown).
#symbol_row = false
#symbols = . , ? ! ' " - : ; ( ) @ / & + = % # * _ € $ < > [ ] { } \ | ~ ^

[look]
# How many readings are offered as suggestions (1-8).
#suggestions = 5
# Thickness of the ink on screen.
#pen_width = 2.6
# Colour of the ink as #rrggbb; empty = the text colour of the colour scheme.
#ink_color =
# The dashed line to write on.
#guide_line = true

[input]
# false: fingers only press keys and pick suggestions; only the pen writes.
#finger_writes = true
# Ignore fingers in the writing area while the pen is near (the resting hand).
#palm_rejection = true

[recognition]
# Pause after the last pen stroke before the writing is recognised (milliseconds).
# Raise it if words get split because you write slowly.
#delay_ms = 800

# Characters the recogniser may output:
#   western  ASCII + Latin-1: English, German, French, Spanish, Italian, Nordic ...
#   latin    additionally Latin Extended: Polish, Czech, Turkish, Hungarian ...
#   all      everything the model knows (adds Chinese and Japanese)
#scripts = western

# The languages you write in.  auto = session language + English.
# Examples:  languages = de_DE, en_US      languages = none
# A language with a spell-check dictionary (hunspell, /usr/share/hunspell) gets
# its readings judged and corrected by it; "de", "fr" ... also work without one.
# Your own words (names, terms) go into ~/.config/kritzel/words.txt, one per line.
#languages = auto
# What a tap on the language key does:  list (shows the languages) | next
#language_button = list
# true: "all my languages together" can be chosen as well.
#language_all = false
# true: of the letters beyond a-z only those of the language in use are recognised.
#language_letters = true
# How strongly a dictionary word is preferred (0 = dictionaries off).
#dictionary_weight = 1.5
# A word that is in no dictionary but one slip away from a dictionary word:
#   off      is left as read
#   suggest  the dictionary word is offered as another suggestion
#   auto     the dictionary word is typed, the reading is offered instead
#corrections = suggest

# true:  recognised text is typed immediately; tap another suggestion to swap it.
# false: nothing is typed until you tap one of the suggestions.
#auto_insert = true
# Automatic spaces:
#   after   a space follows every word; a comma or full stop written next closes up
#   before  a space is put in front of a word where one is missing
#   off     no automatic spaces
#auto_space = after
# true: sentences start with a capital letter.
#capitalize = false

# How tapping another suggestion replaces the word that was typed:
#   auto  delete and insert in one step where the application supports it,
#         otherwise Backspace keys followed by the new word
#   keys  always Backspace keys (try this if replacing misbehaves in some application)
#replace = auto

# small (included), or the path of another PP-OCR recognition model (.onnx).
#model = small
#threads = 2
